services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/local-setup.sh}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 3s
      timeout: 3s
      retries: 30
  localstack:
    image: localstack/localstack:2026.04.0
    environment:
      SERVICES: events,sqs
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set a licensed LocalStack auth token}
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
    ports: ["127.0.0.1:4566:4566"]
    volumes:
      - ./infra/local/init-aws.py:/etc/localstack/init/ready.d/init-aws.py:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal events describe-event-bus --name cinema && awslocal sqs get-queue-url --queue-name cinema-notifications"]
      interval: 5s
      timeout: 5s
      retries: 40
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/cinema
      DB_PASSWORD: ${DB_PASSWORD}
      LOCAL_KEYS: /app/keys
      LOCAL_CUSTOMER_PASSWORD: ${LOCAL_CUSTOMER_PASSWORD}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT: http://localstack:4566
      AWS_QUEUE_URL: http://localstack:4566/000000000000/cinema-notifications
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./.local:/app/keys:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080; printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  postgres-data:
  localstack-data:
