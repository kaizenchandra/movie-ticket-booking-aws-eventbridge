groups:
  - name: cinema
    rules:
      - alert: CinemaOutboxStalled
        expr: cinema_outbox_oldest_seconds > 300
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Cinema outbox delivery is stalled"}
      - alert: CinemaRefundBacklog
        expr: cinema_refunds_pending > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Inspect pending refund obligations and provider health"}
      - alert: CinemaDatabaseSaturated
        expr: hikaricp_connections_pending > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Database pool waiting requests"}
      - alert: CinemaHttpFailures
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "HTTP failures or scheduler overload"}
