name: verify
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B verify
        env: { AWS_ACCESS_KEY_ID: test, AWS_SECRET_ACCESS_KEY: test }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: 'target/*-reports/' }
  aws-local:
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: scripts/local-setup.sh
      - run: docker compose up -d --build --wait
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - run: scripts/smoke.sh && scripts/messaging-smoke.py
      - if: always()
        run: docker compose logs --no-color > compose.log
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compose-logs, path: compose.log }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          severity: CRITICAL,HIGH
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install cfn-lint==1.56.3 openapi-spec-validator==0.9.0
      - run: cfn-lint infra/aws/stack.json && openapi-spec-validator src/main/resources/static/openapi.yaml
