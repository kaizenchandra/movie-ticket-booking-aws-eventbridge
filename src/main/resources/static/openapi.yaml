{
  "openapi": "3.1.0",
  "info": {
    "title": "Cinema booking API",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "http://localhost:8080"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Reserve": {
        "type": "object",
        "required": [
          "showId",
          "seats"
        ],
        "properties": {
          "showId": {
            "type": "string",
            "format": "uuid"
          },
          "seats": {
            "type": "array",
            "minItems": 1,
            "maxItems": 8,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[A-Za-z0-9-]{1,12}$"
            }
          }
        }
      },
      "Payment": {
        "type": "object",
        "required": [
          "mode"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "SUCCESS",
              "FAILURE",
              "DELAY",
              "DUPLICATE",
              "REFUND_RETRY"
            ]
          }
        }
      },
      "Movie": {
        "type": "object",
        "required": [
          "title",
          "durationMinutes"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "durationMinutes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 600
          }
        }
      },
      "Cinema": {
        "type": "object",
        "required": [
          "name",
          "city"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 200
          },
          "city": {
            "type": "string",
            "maxLength": 120
          }
        }
      },
      "Screen": {
        "type": "object",
        "required": [
          "cinemaId",
          "name",
          "seats"
        ],
        "properties": {
          "cinemaId": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "maxLength": 100
          },
          "seats": {
            "type": "array",
            "minItems": 1,
            "maxItems": 500,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[A-Za-z0-9-]{1,12}$"
            }
          }
        }
      },
      "Show": {
        "type": "object",
        "required": [
          "movieId",
          "screenId",
          "startsAt",
          "endsAt",
          "priceMinor",
          "currency"
        ],
        "properties": {
          "movieId": {
            "type": "string",
            "format": "uuid"
          },
          "screenId": {
            "type": "string",
            "format": "uuid"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          },
          "priceMinor": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 100000000
          },
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          }
        }
      },
      "Problem": {
        "type": "object",
        "required": [
          "status",
          "code"
        ],
        "properties": {
          "status": {
            "type": "integer"
          },
          "code": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          }
        }
      },
      "Booking": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "showId": {
            "type": "string",
            "format": "uuid"
          },
          "owner": {
            "type": "string"
          },
          "seats": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "total": {
            "type": "object",
            "properties": {
              "minor": {
                "type": "integer",
                "format": "int64"
              },
              "currency": {
                "type": "string"
              }
            }
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          },
          "status": {
            "enum": [
              "HELD",
              "PAYMENT_PENDING",
              "CONFIRMED",
              "EXPIRED",
              "CANCELLED",
              "FAILED"
            ]
          },
          "hold": {
            "enum": [
              "ACTIVE",
              "CONSUMED",
              "EXPIRED",
              "RELEASED"
            ]
          },
          "payment": {
            "enum": [
              "NONE",
              "PENDING",
              "UNKNOWN",
              "SUCCEEDED",
              "FAILED"
            ]
          },
          "refund": {
            "enum": [
              "NONE",
              "PENDING",
              "SUCCEEDED"
            ]
          },
          "mode": {
            "type": "string"
          }
        }
      }
    }
  },
  "paths": {
    "/api/movies": {
      "get": {
        "summary": "Browse movies",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Movie"
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Invalid/missing JWT",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "Role denied",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Missing or not owned",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "Conflict; inspect code",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "Rate limited",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "Overloaded; retry with same idempotency key",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "title",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 10000,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          }
        ]
      }
    },
