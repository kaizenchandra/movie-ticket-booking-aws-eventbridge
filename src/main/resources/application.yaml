spring:
  application:
    name: cinema
  main:
    web-application-type: reactive
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinema}
    username: ${DB_USER:cinema}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 2000
      connection-init-sql: "SET statement_timeout='5s'; SET lock_timeout='2s'; SET idle_in_transaction_session_timeout='10s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  codec:
    max-in-memory-size: 64KB
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
  netty:
    connection-timeout: 5s
    idle-timeout: 30s
  max-http-request-header-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 0.1
logging:
  structured:
    format:
      console: logstash
aws:
  region: ${AWS_REGION:us-east-1}
  endpoint: ${AWS_ENDPOINT:}
  bus: ${AWS_BUS:cinema}
  queue-url: ${AWS_QUEUE_URL:http://localhost:4566/000000000000/cinema-notifications}
security:
  issuer: ${OIDC_ISSUER:}
  jwk-set-uri: ${OIDC_JWK_SET_URI:}
  audience: ${OIDC_AUDIENCE:cinema}
  cors-origin: ${CORS_ORIGIN:http://localhost:8080}
